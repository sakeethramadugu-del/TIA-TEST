<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings - ApexVest</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .settings-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    
    .settings-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .settings-header h1 {
      color: #F8FAFC;
      margin-bottom: 8px;
    }
    
    .settings-header p {
      color: #94A3B8;
    }
    
    .settings-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    
    .settings-card h3 {
      color: #F8FAFC;
      margin-bottom: 16px;
      font-size: 18px;
    }
    
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }
    
    .setting-item:last-child {
      border-bottom: none;
    }
    
    .setting-label {
      color: #F8FAFC;
      font-weight: 600;
    }
    
    .setting-description {
      color: #94A3B8;
      font-size: 14px;
      margin-top: 4px;
    }
    
    .setting-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(148, 163, 184, 0.3);
      transition: 0.3s;
      border-radius: 26px;
    }
    
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .toggle-slider {
      background-color: #60A5FA;
    }
    
    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #60A5FA;
      text-decoration: none;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .save-btn {
      background: #60A5FA;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    
    .save-btn:hover {
      background: #3B82F6;
      transform: translateY(-2px);
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <a href="/" class="back-link">← Back to Dashboard</a>
    
    <div class="settings-header">
      <h1>⚙️ Settings</h1>
      <p>Customize your experience</p>
    </div>
    
    <div id="settingsContent" class="loading">
      Loading settings...
    </div>
  </div>
  
  <script>
    let currentSettings = {};
    
    async function loadSettings() {
      try {
        const response = await fetch('/api/settings');
        const data = await response.json();
        
        if (data.status === 'success') {
          currentSettings = data.settings;
          renderSettings(data.settings);
        } else {
          document.getElementById('settingsContent').innerHTML = 
            '<p style="text-align: center; color: #EF4444;">Failed to load settings</p>';
        }
      } catch (error) {
        console.error('Failed to load settings:', error);
        document.getElementById('settingsContent').innerHTML = 
          '<p style="text-align: center; color: #EF4444;">Failed to load settings</p>';
      }
    }
    
    function renderSettings(settings) {
      const container = document.getElementById('settingsContent');
      
      if (!settings || Object.keys(settings).length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #94A3B8;">Settings not available for guests</p>';
        return;
      }
      
      let html = '<div class="settings-card">';
      html += '<h3>Preferences</h3>';
      
      // Theme setting
      html += '<div class="setting-item">';
      html += '<div>';
      html += '<div class="setting-label">Theme</div>';
      html += '<div class="setting-description">Choose your preferred theme</div>';
      html += '</div>';
      html += '<div class="setting-control">';
      html += '<select id="themeSelect" style="padding: 8px; border-radius: 6px; background: rgba(30, 41, 59, 0.8); color: #F8FAFC; border: 1px solid rgba(148, 163, 184, 0.2);">';
      html += `<option value="dark" ${settings.theme === 'dark' ? 'selected' : ''}>Dark</option>`;
      html += `<option value="light" ${settings.theme === 'light' ? 'selected' : ''}>Light</option>`;
      html += '</select>';
      html += '</div></div>';
      
      // Notifications setting
      html += '<div class="setting-item">';
      html += '<div>';
      html += '<div class="setting-label">Notifications</div>';
      html += '<div class="setting-description">Enable in-app notifications</div>';
      html += '</div>';
      html += '<div class="setting-control">';
      html += '<label class="toggle-switch">';
      html += `<input type="checkbox" id="notificationsToggle" ${settings.notifications ? 'checked' : ''}>`;
      html += '<span class="toggle-slider"></span>';
      html += '</label>';
      html += '</div></div>';
      
      // Email updates setting
      html += '<div class="setting-item">';
      html += '<div>';
      html += '<div class="setting-label">Email Updates</div>';
      html += '<div class="setting-description">Receive email updates about your portfolio</div>';
      html += '</div>';
      html += '<div class="setting-control">';
      html += '<label class="toggle-switch">';
      html += `<input type="checkbox" id="emailUpdatesToggle" ${settings.email_updates ? 'checked' : ''}>`;
      html += '<span class="toggle-slider"></span>';
      html += '</label>';
      html += '</div></div>';
      
      html += '</div>';
      
      // Save button
      html += '<button class="save-btn" onclick="saveSettings()">Save Settings</button>';
      
      container.innerHTML = html;
    }
    
    async function saveSettings() {
      const theme = document.getElementById('themeSelect').value;
      const notifications = document.getElementById('notificationsToggle').checked;
      const emailUpdates = document.getElementById('emailUpdatesToggle').checked;
      
      const newSettings = {
        theme,
        notifications,
        email_updates: emailUpdates
      };
      
      try {
        const response = await fetch('/api/settings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(newSettings)
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
          alert('Settings saved successfully!');
          currentSettings = newSettings;
        } else {
          alert('Failed to save settings');
        }
      } catch (error) {
        console.error('Failed to save settings:', error);
        alert('Failed to save settings');
      }
    }
    
    // Load settings on page load
    loadSettings();
  </script>
</body>
</html>
