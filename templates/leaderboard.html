<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leaderboard - ApexVest</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .leaderboard-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    
    .leaderboard-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .leaderboard-header h1 {
      color: #F8FAFC;
      margin-bottom: 8px;
    }
    
    .leaderboard-header p {
      color: #94A3B8;
    }
    
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .leaderboard-table th {
      text-align: left;
      padding: 12px 16px;
      color: #94A3B8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }
    
    .leaderboard-table td {
      padding: 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }
    
    .leaderboard-rank {
      font-weight: 700;
      color: #FBBF24;
      width: 60px;
    }
    
    .leaderboard-rank.rank-1 {
      color: #FFD700;
      font-size: 20px;
    }
    
    .leaderboard-rank.rank-2 {
      color: #C0C0C0;
      font-size: 18px;
    }
    
    .leaderboard-rank.rank-3 {
      color: #CD7F32;
      font-size: 16px;
    }
    
    .leaderboard-username {
      font-weight: 600;
      color: #F8FAFC;
    }
    
    .leaderboard-xp {
      color: #60A5FA;
      font-weight: 600;
    }
    
    .leaderboard-level {
      color: #A855F7;
      font-weight: 600;
    }
    
    .leaderboard-portfolio {
      color: #22C55E;
      font-weight: 600;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #60A5FA;
      text-decoration: none;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div>
        <p class="eyebrow">ApexVest Academy</p>
        <h1>Leaderboard</h1>
      </div>
    </div>
    <div class="topbar-right">
      <nav class="topnav">
        <a href="/">Dashboard</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/profile">Profile</a>
        <a href="/settings">Settings</a>
      </nav>
    </div>
  </header>
  <main class="leaderboard-page">
    <div class="leaderboard-container">
      <a href="/" class="back-link">← Back to Dashboard</a>
      
      <div class="leaderboard-header">
      <h1>🏆 Leaderboard</h1>
      <p>Top investors ranked by XP</p>
    </div>
    
    <div id="leaderboardContent" class="loading">
      Loading leaderboard...
    </div>
  </div>
  
  <script>
    const fallbackLeaderboard = [
      { rank: 1, username: 'ApexLearner', xp: 710, level: 8, portfolio_value: 14200.50 },
      { rank: 2, username: 'MarketMaven', xp: 640, level: 7, portfolio_value: 13650.10 },
      { rank: 3, username: 'BullRunner', xp: 580, level: 6, portfolio_value: 12100.75 },
      { rank: 4, username: 'FinanceFox', xp: 530, level: 6, portfolio_value: 11680.00 }
    ];

    async function loadLeaderboard() {
      try {
        const response = await fetch('/api/leaderboard');
        const data = await response.json();

        if (data.status === 'success' && Array.isArray(data.leaderboard) && data.leaderboard.length > 0) {
          renderLeaderboard(data.leaderboard);
        } else {
          renderFallbackLeaderboard();
        }
      } catch (error) {
        console.error('Failed to load leaderboard:', error);
        renderFallbackLeaderboard();
      }
    }

    function renderFallbackLeaderboard() {
      const container = document.getElementById('leaderboardContent');
      if (!container) return;
      container.innerHTML = '<p style="text-align: center; color: #94A3B8;">Leaderboard is temporarily unavailable. Showing demo data.</p>';
      renderLeaderboard(fallbackLeaderboard);
    }

    function renderLeaderboard(leaderboard) {
      const container = document.getElementById('leaderboardContent');
      
      if (!leaderboard || leaderboard.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #94A3B8;">No leaderboard data available</p>';
        return;
      }
      
      let html = '<table class="leaderboard-table"><thead><tr>';
      html += '<th>Rank</th><th>Username</th><th>XP</th><th>Level</th><th>Portfolio</th>';
      html += '</tr></thead><tbody>';
      
      leaderboard.forEach(entry => {
        const rankClass = entry.rank <= 3 ? `rank-${entry.rank}` : '';
        html += `<tr>
          <td class="leaderboard-rank ${rankClass}">#${entry.rank}</td>
          <td class="leaderboard-username">${entry.username}</td>
          <td class="leaderboard-xp">${entry.xp} XP</td>
          <td class="leaderboard-level">Level ${entry.level}</td>
          <td class="leaderboard-portfolio">$${entry.portfolio_value.toFixed(2)}</td>
        </tr>`;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }
    
    // Load leaderboard on page load
    loadLeaderboard();
  </script>
</body>
</html>
